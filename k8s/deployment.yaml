apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-http-server
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-http-server
  template:
    metadata:
      labels:
        app: my-http-server
    spec:
      containers:
        - name: my-http-server
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADDRESS
              value: ":8080"
