apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-webserver
  namespace: demo
spec:
  stripPrefix:
    prefixes:
      - /webserver
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-go
  namespace: demo
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: demo-strip-webserver@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /webserver
        pathType: Prefix
        backend:
          service:
            name: my-http-server
            port:
              number: 8080
